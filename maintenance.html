<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#dce9ff"><title>Shortcuts+ — Under Construction</title><link rel="icon" href="/favicon.png">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;color:#1d2b45;background:radial-gradient(ellipse at 15% 20%,#c6dcff 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#d9c9fa 0,transparent 48%),linear-gradient(135deg,#e9f2ff,#f5f4ff);overflow-x:hidden}
.orb{position:fixed;width:40vmax;aspect-ratio:1;border-radius:50%;filter:blur(12px);opacity:.45;pointer-events:none}.orb.a{top:-20vmax;right:-14vmax;background:linear-gradient(130deg,#a6d4ff,#a6b4ff)}.orb.b{bottom:-25vmax;left:-15vmax;background:linear-gradient(130deg,#b6d6ff,#e3b8f6)}
main{position:relative;width:min(590px,calc(100% - 36px));padding:clamp(32px,7vw,65px);text-align:center;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.83);border-radius:38px;box-shadow:0 24px 80px rgba(48,76,134,.16),inset 0 1px rgba(255,255,255,.95);backdrop-filter:blur(36px) saturate(175%);-webkit-backdrop-filter:blur(36px) saturate(175%)}
.brand{display:flex;justify-content:center;align-items:center;gap:9px;font-weight:750;font-size:20px;letter-spacing:-.6px}.brand img{width:34px;height:34px;border-radius:10px}.brand b{color:#2678d9}
.symbol{margin:38px auto 25px;width:94px;height:94px;display:grid;place-items:center;border-radius:28px;font-size:45px;background:linear-gradient(145deg,rgba(255,255,255,.83),rgba(255,255,255,.27));border:1px solid #fff;box-shadow:0 12px 36px #7e9dce35,inset 0 1px #fff;animation:float 4s ease-in-out infinite}
.eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:800;color:#3978c9}h1{font-size:clamp(37px,8vw,62px);letter-spacing:-2.6px;line-height:1.07;margin:16px 0 20px}h1 span{background:linear-gradient(100deg,#1479d3,#8874d8);background-clip:text;-webkit-background-clip:text;color:transparent}p{font-size:16px;line-height:1.7;color:#52637c;margin:0 auto;max-width:430px}
.status{display:inline-flex;align-items:center;gap:10px;margin-top:34px;padding:12px 18px;background:rgba(255,255,255,.55);border:1px solid #fff;border-radius:999px;box-shadow:inset 0 1px #fff;color:#334762;font-size:13px}.dot{height:8px;width:8px;background:#3e94e8;border-radius:50%;box-shadow:0 0 0 4px #3e94e825;animation:pulse 2s infinite}footer{font-size:12px;color:#70819a;margin-top:44px}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark}body{color:#f5f8ff;background:radial-gradient(ellipse at 10% 10%,#203c68,transparent 52%),radial-gradient(ellipse at 90% 90%,#382d63,transparent 50%),#0b1427}main{background:rgba(42,56,81,.45);border-color:#ffffff38;box-shadow:0 24px 80px #0005,inset 0 1px #ffffff25}.symbol,.status{background:rgba(255,255,255,.09);border-color:#ffffff38}.eyebrow{color:#9ec9ff}p{color:#c0cce0}.status{color:#e0e8f8}footer{color:#a3b0c6}}
</style></head><body><div class="orb a" aria-hidden="true"></div><div class="orb b" aria-hidden="true"></div><main><div class="brand"><img src="/favicon.png" alt="">Shortcuts<b>+</b></div><div class="symbol" aria-hidden="true">🚧</div><div class="eyebrow">Something better is on the way</div><h1>Under<br><span>construction.</span></h1><p>We're making improvements behind the scenes. Shortcuts+ will be back with a better experience soon. Thanks for your patience!</p><div class="status"><span class="dot" aria-hidden="true"></span>Website improvements in progress</div><footer>© 2026 Shortcuts+ · Built by EzTheRed</footer></main></body></html>
