<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shortcuts+ — Under Construction</title><meta name="description" content="Shortcuts+ is getting an upgrade. Check back soon."><meta name="theme-color" content="#0c1019"><meta name="robots" content="noindex"><link rel="icon" href="/favicon.png">
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#0c1019;color:#f5f7fc;display:grid;place-items:center;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 36%,#28354d 0%,transparent 60%)}
.top,.bottom{position:fixed;left:0;right:0;height:13px;background:repeating-linear-gradient(115deg,#f5c744 0 25px,#11151c 25px 50px);z-index:2}.top{top:0}.bottom{bottom:0}
main{position:relative;width:min(620px,calc(100% - 40px));padding:65px 0;text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;font-size:19px;font-weight:750;letter-spacing:-.6px}.brand img{width:33px;height:33px;border-radius:9px}.brand b{color:#f5c744}
.symbol{margin:48px auto 25px;width:100px;height:100px;display:grid;place-items:center;border:1px solid #5d4e29;border-radius:28px;background:linear-gradient(145deg,#3c3421,#201f1d);box-shadow:0 0 70px #f5c74415;font-size:48px;animation:float 4s ease-in-out infinite}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:800;color:#f5c744}
h1{font-size:clamp(40px,8vw,70px);line-height:1.05;letter-spacing:-2.8px;margin:18px 0 22px}
h1 span{color:#f5c744}p{color:#aeb8c9;line-height:1.75;font-size:17px;max-width:440px;margin:0 auto}
.status{margin:36px auto 0;display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border:1px solid #364151;border-radius:100px;background:#171e2a;color:#d8dfeb;font-size:13px}
.dot{height:8px;width:8px;border-radius:50%;background:#f5c744;box-shadow:0 0 0 4px #f5c74420;animation:pulse 2s infinite}
footer{margin-top:70px;color:#7f8b9e;font-size:12px}
@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class="top" aria-hidden="true"></div><main>
<div class="brand"><img src="/favicon.png" alt="">Shortcuts<b>+</b></div>
<div class="symbol" aria-hidden="true">🚧</div>
<div class="eyebrow">Something better is on the way</div>
<h1>Under<br><span>construction.</span></h1>
<p>We're making improvements behind the scenes. Shortcuts+ will be back with a better experience soon. Thanks for your patience!</p>
<div class="status"><span class="dot" aria-hidden="true"></span>Website improvements in progress</div>
<footer>© 2026 Shortcuts+ · Built by EzTheRed</footer>
</main><div class="bottom" aria-hidden="true"></div></body></html>
