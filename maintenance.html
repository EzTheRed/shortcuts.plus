<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#dce9ff"><title>Shortcuts+ — Under Construction</title><link rel="icon" type="image/svg+xml" href="https://shortcuts.plus/assets/icons/favicon.svg?v=20261113-diamond">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;color:#1d2b45;background:radial-gradient(ellipse at 15% 20%,#c6dcff 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#d9c9fa 0,transparent 48%),linear-gradient(135deg,#e9f2ff,#f5f4ff);overflow-x:hidden}
.orb{position:fixed;width:40vmax;aspect-ratio:1;border-radius:50%;filter:blur(12px);opacity:.45;pointer-events:none}.orb.a{top:-20vmax;right:-14vmax;background:linear-gradient(130deg,#a6d4ff,#a6b4ff)}.orb.b{bottom:-25vmax;left:-15vmax;background:linear-gradient(130deg,#b6d6ff,#e3b8f6)}

.brand{display:flex;justify-content:center;align-items:center;gap:9px;font-weight:750;font-size:20px;letter-spacing:-.6px}.brand img{width:34px;height:34px;border-radius:10px}.brand b{color:#2678d9}
.symbol{margin:38px auto 25px;width:94px;height:94px;display:grid;place-items:center;border-radius:28px;font-size:45px;background:linear-gradient(145deg,rgba(255,255,255,.83),rgba(255,255,255,.27));border:1px solid #fff;box-shadow:0 12px 36px #7e9dce35,inset 0 1px #fff;animation:float 4s ease-in-out infinite}

.status{display:inline-flex;align-items:center;gap:10px;margin-top:34px;padding:12px 18px;background:rgba(255,255,255,.55);border:1px solid #fff;border-radius:999px;box-shadow:inset 0 1px #fff;color:#334762;font-size:13px}.dot{height:8px;width:8px;background:#3e94e8;border-radius:50%;box-shadow:0 0 0 4px #3e94e825;animation:pulse 2s infinite}footer{font-size:12px;color:#70819a;margin-top:44px}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark}body{color:#f5f8ff;background:radial-gradient(ellipse at 10% 10%,#203c68,transparent 52%),radial-gradient(ellipse at 90% 90%,#382d63,transparent 50%),#0b1427}main{background:rgba(42,56,81,.45);border-color:#ffffff38;box-shadow:0 24px 80px #0005,inset 0 1px #ffffff25}.symbol,.status{background:rgba(255,255,255,.09);border-color:#ffffff38}.eyebrow{color:#9ec9ff}p{color:#c0cce0}.status{color:#e0e8f8}footer{color:#a3b0c6}}

/* Adaptive layered glass for the public maintenance screen */
body{background:radial-gradient(ellipse at 15% 15%,#344d7e 0%,transparent 48%),radial-gradient(ellipse at 90% 85%,#513b73 0%,transparent 48%),#0c1019;background-attachment:fixed}main{padding:65px 28px;border:1px solid rgba(255,255,255,.22);border-radius:38px;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.045) 48%,rgba(255,255,255,.09));box-shadow:0 24px 90px #0005,inset 0 1px 0 #ffffff55,inset 1px 0 0 #ffffff1c;backdrop-filter:blur(38px) saturate(190%);-webkit-backdrop-filter:blur(38px) saturate(190%)}.symbol,.status{backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.25);box-shadow:0 12px 38px #0003,inset 0 1px 0 #ffffff40}.symbol{background:linear-gradient(135deg,#ffffff35,#f5c74420)}.status{background:rgba(255,255,255,.09)}@media(max-width:640px){main{padding:45px 20px;border-radius:28px}.symbol{margin-top:30px}}@media(prefers-reduced-transparency:reduce){main{background:#20283a;backdrop-filter:none;-webkit-backdrop-filter:none}.symbol,.status{backdrop-filter:none;-webkit-backdrop-filter:none}}@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){main{background:#20283a}}

/* Stronger refractive distortion through the glass pane, leaving the text sharp. */
main{isolation:isolate;background:rgba(255,255,255,.045)}
main::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.21),rgba(255,255,255,.025) 42%,rgba(255,255,255,.11));box-shadow:inset 3px 3px 5px rgba(255,255,255,.32),inset -5px -5px 12px rgba(3,9,25,.3)}
@supports (backdrop-filter: url("#liquid-refraction")){main{-webkit-backdrop-filter:blur(1px) url("#liquid-refraction") saturate(175%);backdrop-filter:blur(1px) url("#liquid-refraction") saturate(175%)}}
@media(prefers-reduced-transparency:reduce){main{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:#20283a}}
body:has(#liquid-webgl){background:transparent!important}#liquid-webgl{z-index:0!important}body:has(#liquid-webgl) main{z-index:1}body:has(#liquid-webgl) main{background:rgba(255,255,255,.08)}@media(prefers-color-scheme:dark){body:has(#liquid-webgl) main{background:rgba(24,34,58,.15)}}
