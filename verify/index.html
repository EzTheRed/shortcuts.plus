<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef2ff"><title>Verify email — Shortcuts+</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 25% 10%,#d9e7ff,transparent 48%),linear-gradient(130deg,#f6f8ff,#e7ebf6);color:#1d2840;padding:24px}.panel{width:min(100%,440px);padding:34px;border:1px solid #ffffffb0;border-radius:30px;background:#ffffffb8;backdrop-filter:blur(24px);box-shadow:0 24px 75px #465b891e}.brand{font-size:14px;font-weight:750;color:#5269ad;letter-spacing:.03em}h1{font-size:32px;letter-spacing:-.04em;margin:17px 0 8px}p{color:#63708b;line-height:1.5;margin:0 0 24px}label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input{width:100%;border:1px solid #cdd6e9;background:#fff;border-radius:14px;padding:15px 16px;font:inherit;color:#1d2840}input:focus{outline:3px solid #7d9dff66;border-color:#6589ee}button{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:#4169e1;color:white;margin-top:17px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e7ecf8;color:#3b5392;margin-top:10px}.hidden{display:none}.status{margin-top:18px;padding:13px;border-radius:12px;background:#eef2fb;color:#344a7e;font-size:14px;line-height:1.45}.status.error{background:#ffe9e9;color:#9e2939}.status.ok{background:#e4f7e9;color:#216c3c}.small{font-size:12px;margin-top:22px;text-align:center}a{color:#4169e1}@media(prefers-color-scheme:dark){body{background:radial-gradient(circle at 20% 10%,#26365a,transparent 50%),#101522;color:#f3f5ff}.panel{background:#1d2534d9;border-color:#ffffff20}p{color:#a5b0c9}input{background:#151c2b;border-color:#3e4b64;color:white}.secondary{background:#303c54;color:#e1e9ff}.status{background:#293957;color:#e1e9ff}}</style></head>
<body><main class="panel"><div class="brand">SHORTCUTS+</div><h1>Verify your email</h1><p>Enter your email address to receive a secure, six-digit verification code.</p>
<form id="request"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><button id="send" type="submit">Send verification code</button></form>
<form id="confirm" class="hidden"><label for="code">Six-digit code</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required><button id="verify" type="submit">Verify email</button><button id="again" type="button" class="secondary">Use a different email</button></form>
<div id="status" class="status hidden" role="status" aria-live="polite"></div><p class="small"><a href="/">Back to Shortcuts+</a></p></main>
<script>
(()=>{'use strict';const base='/verify/api/',el=id=>document.getElementById(id),request=el('request'),confirm=el('confirm'),status=el('status');let challenge=null,email=null;
function say(message,kind=''){status.textContent=message;status.className='status '+kind}
async function call(path,data){const response=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});let result;try{result=await response.json()}catch{throw Error('Unexpected server response. Please try again.')}if(!response.ok)throw Error(result.error||'Request failed.');return result}
request.addEventListener('submit',async e=>{e.preventDefault();const btn=el('send');btn.disabled=true;email=el('email').value.trim().toLowerCase();say('Requesting your code…');try{const data=await call('start',{email});challenge=data.challenge_id;request.classList.add('hidden');confirm.classList.remove('hidden');say('Code sent. Check your inbox, then enter the six-digit code below.','ok');el('code').focus()}catch(err){say(err.message||'Could not send code.','error')}finally{btn.disabled=false}});
confirm.addEventListener('submit',async e=>{e.preventDefault();const btn=el('verify');btn.disabled=true;say('Checking your code…');try{const data=await call('verify',{email,challenge_id:challenge,code:el('code').value.trim()});if(data.verified){say('Email verified successfully! You can now close this page.','ok');confirm.classList.add('hidden')}}catch(err){say(err.message||'Verification failed.','error')}finally{btn.disabled=false}});
el('again').addEventListener('click',()=>{challenge=null;confirm.classList.add('hidden');request.classList.remove('hidden');status.classList.add('hidden')});
})();
</script></body></html>
