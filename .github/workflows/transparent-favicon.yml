name: Generate transparent favicon PNG
on:
  push:
    paths:
      - '.github/workflows/transparent-favicon.yml'
      - 'assets/icons/favicon.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render transparent PNG
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          import re
          import cairosvg
          from PIL import Image, ImageFilter, ImageChops
          source = Path('assets/icons/favicon.svg').read_text()
          # PNG-only rendering: keep original SVG unchanged.
          source = source.replace('filter="url(#glassWarp)"', '')
          source = re.sub(r'<filter id="glassWarp"[^>]*>.*?</filter>', '', source, flags=re.S)
          # Fade the navy ends of the two diamond gradients into transparency.
          source = source.replace('<stop offset="0" stop-color="#17496B"/>',
                                  '<stop offset="0" stop-color="#17496B" stop-opacity="0"/>')
          source = source.replace('<stop offset="1" stop-color="#49316A"/>',
                                  '<stop offset="1" stop-color="#49316A" stop-opacity="0"/>')
          cairosvg.svg2png(bytestring=source.encode(),
                           write_to='assets/icons/favicon-transparent.png',
                           output_width=512, output_height=512)
          img = Image.open('assets/icons/favicon-transparent.png').convert('RGBA')
          assert img.getpixel((0,0))[3] == 0, 'Expected transparent corner'
          # Feather only the diamond silhouettes; do not erode the white plus.
          alpha = img.getchannel('A')
          softened = alpha.filter(ImageFilter.MinFilter(5)).filter(ImageFilter.GaussianBlur(2))
          # Keep the plus untouched: its location is x=~660..950, y=~60..350 in SVG.
          from PIL import ImageDraw
          plus_mask = Image.new('L', img.size, 0)
          d = ImageDraw.Draw(plus_mask)
          d.rectangle((325, 20, 490, 190), fill=255)
          alpha = Image.composite(alpha, softened, plus_mask)
          img.putalpha(alpha)
          img.save('assets/icons/favicon-transparent.png', optimize=True)
          PY
      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icons/favicon-transparent.png
          if ! git diff --cached --quiet; then
            git commit -m "Add transparent PNG favicon for email and fallback"
            git push
          fi
